name: Lembrete diário

on:
  schedule:
    # 15:15 no horário de Brasília (18:15 UTC). O GitHub pode atrasar alguns minutos.
    - cron: '15 18 * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Mandar um e-mail de teste mesmo sem pendência'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  lembrete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar e mandar e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LEMBRETE_PARA: ${{ secrets.LEMBRETE_PARA }}
          FORCAR: ${{ inputs.forcar && '1' || '0' }}
        run: python3 scripts/lembrete.py

      # O GitHub pausa agendamentos de repositórios sem atividade por 60 dias.
      # Se o último commit tiver mais de 50 dias, faz um commit vazio para manter ativo.
      - name: Manter o agendamento ativo
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter lembrete ativo"
            git push
          fi
